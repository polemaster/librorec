spring.application.name=backend
spring.config.import=optional:file:.env[.properties]
hardcover.app.api-key=${HARDCOVER_API_KEY:}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-4-hydrogen
spring.ai.google.genai.chat.thinking-level=LOW
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.options.model=openrouter/free
# spring.ai.openai.api-key=${GROQ_API_KEY:}
# spring.ai.openai.base-url=https://api.groq.com/openai/v1
# spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.mvc.problemdetails.enabled=true
